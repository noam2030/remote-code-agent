[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-code-agent"
version = "0.1.0"
description = "Google Antigravity Agent Service on Cloud Run"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "google-antigravity",
]

[project.scripts]
remote-code-agent = "remote_code_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]
