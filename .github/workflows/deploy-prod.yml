name: Deploy Production to Google Cloud & Vercel

on:
  push:
    branches: [ main ]

jobs:
  test-backend:
    name: Run Automated Tests (Backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated test suite
        run: |
          python -m unittest discover tests

  test-frontend:
    name: Verify Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  deploy-api:
    name: Deploy API to Cloud Run (Production)
    needs: [test-backend, test-frontend]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run (Production)
        env:
          AGY_OAUTH_TOKEN_VAL: ${{ secrets.AGY_OAUTH_TOKEN }}
          GEMINI_API_KEY_VAL: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN_VAL: ${{ secrets.GH_TOKEN }}
          VERCEL_TOKEN_VAL: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_VAL: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PRJ_VAL: ${{ secrets.VERCEL_PROJECT_ID }}
          GCP_SA_KEY_VAL: ${{ secrets.GCP_SA_KEY }}
        run: |
          python3 -c "
          import json, os
          env_vars = {
              'AGENT_WORKSPACE': 'workspace',
              'AGY_OAUTH_TOKEN': os.environ.get('AGY_OAUTH_TOKEN_VAL', ''),
              'GEMINI_API_KEY': os.environ.get('GEMINI_API_KEY_VAL', ''),
              'GH_TOKEN': os.environ.get('GH_TOKEN_VAL', ''),
              'VERCEL_TOKEN': os.environ.get('VERCEL_TOKEN_VAL', ''),
              'VERCEL_ORG_ID': os.environ.get('VERCEL_ORG_VAL', ''),
              'VERCEL_PROJECT_ID': os.environ.get('VERCEL_PRJ_VAL', ''),
              'GCP_SA_KEY': os.environ.get('GCP_SA_KEY_VAL', ''),
          }
          with open('/tmp/cloudrun_env.yaml', 'w') as f:
              for k, v in env_vars.items():
                  if v:
                      f.write(f'{k}: {json.dumps(v)}\n')
          "
          gcloud run deploy remote-code-agent \
            --project ${{ vars.GCP_PROJECT_ID || 'ai-learning-499409' }} \
            --source . \
            --region ${{ vars.GCP_REGION || 'us-central1' }} \
            --allow-unauthenticated \
            --timeout=3600 \
            --env-vars-file=/tmp/cloudrun_env.yaml
          rm -f /tmp/cloudrun_env.yaml

  deploy-frontend:
    name: Deploy Frontend to Vercel (Production)
    needs: [test-backend, test-frontend]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Deploy Frontend to Vercel (Production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_abCCfq6oAKpFKOLdLU0hsGg5' }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_haBy0oc6TegmML9Z7aj7yKlMFgxm' }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not configured in repository secrets."
            echo "Please add VERCEL_TOKEN to GitHub repository secrets (Settings > Secrets and variables > Actions) to complete Vercel production deployment."
            exit 1
          fi
          mkdir -p .vercel
          echo "{\"projectId\":\"$VERCEL_PROJECT_ID\",\"orgId\":\"$VERCEL_ORG_ID\"}" > .vercel/project.json
          npx --yes vercel deploy --prod --token="$VERCEL_TOKEN" --build-env VITE_API_URL="https://remote-code-agent-289332143182.us-central1.run.app"
